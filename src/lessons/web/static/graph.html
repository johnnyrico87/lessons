<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lessons — graph explorer</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="/static/card.js" defer></script>
  <style>
    .graph-wrap { display:flex; height:calc(100vh - 52px); }
    #cy { flex:1; background:var(--surface); transition:margin-right 0.2s ease; }
    /* when the detail rail is open, dock the graph beside it instead of under it */
    body.rail-open #cy { margin-right:380px; }
    @media (max-width:820px){ body.rail-open #cy { margin-right:0; } }
    @media (prefers-reduced-motion: reduce){ #cy { transition:none; } }
    .filters { display:flex; gap:6px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--hairline); }
    .filters button {
      font:inherit; font-size:12px; padding:5px 10px; border-radius:999px;
      border:1px solid var(--hairline); background:transparent; color:var(--text-dim); cursor:pointer;
    }
    .filters button.active { border-color:var(--accent); color:var(--accent); }
    .graph-hint {
      position:fixed; left:18px; bottom:16px; max-width:320px; z-index:5;
      color:var(--text-dim); font-size:12px; line-height:1.5; pointer-events:none;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">lessons</span>
    <nav class="get-app">
      <a class="btn btn-ghost" href="/">← Search</a>
    </nav>
  </header>
  <div class="filters" id="filters"></div>
  <div class="graph-wrap">
    <div id="cy"></div>
  </div>
  <p class="graph-hint">Click any node to open its full detail in the right panel — key lessons, quotes, and the leaders it connects to. Edge color: blue = relation, amber = tension.</p>

  <script>
  const TYPES = ["all","person","company","lesson","principle","experience","situation","era"];
  const TYPE_COLOR = {
    person:"#7aa2f7", company:"#9ece6a", lesson:"#e0af68", principle:"#bb9af7",
    experience:"#7dcfff", situation:"#f7768e", era:"#9aa3b2"
  };
  let cy, activeType = "all";

  function styleSheet() {
    return [
      { selector:"node", style:{
        "background-color": (n)=>TYPE_COLOR[n.data("ntype")]||"#9aa3b2",
        "label":"data(label)", "color":"#e7e9ee", "font-size":"10px",
        "text-valign":"bottom","text-margin-y":"4px","width":28,"height":28,
        "text-max-width":"90px","text-wrap":"ellipsis"
      }},
      { selector:"edge", style:{
        "width":1.5, "line-color":"#7aa2f7", "target-arrow-color":"#7aa2f7",
        "target-arrow-shape":"triangle","curve-style":"bezier",
        "label":"data(relation)","font-size":"8px","color":"#9aa3b2","text-rotation":"autorotate"
      }},
      { selector:'edge[?tension]', style:{ "line-color":"#e0a458","target-arrow-color":"#e0a458" }},
      { selector:"node:selected", style:{ "border-width":3,"border-color":"#e7e9ee" }}
    ];
  }

  async function loadGraph(type) {
    const url = type && type!=="all" ? `/api/graph?node_type=${type}` : "/api/graph";
    const data = await (await fetch(url)).json();
    cy = cytoscape({
      container: document.getElementById("cy"),
      elements: data.elements,
      style: styleSheet(),
      layout: { name:"cose", animate:false, padding:30 }
    });
    cy.on("tap","node", (e)=>{ if(window.LeaderCard) LeaderCard.open(e.target.id()); });
  }

  function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

  function buildFilters(){
    const bar = document.getElementById("filters");
    TYPES.forEach(t=>{
      const b=document.createElement("button");
      b.textContent=t; if(t==="all") b.className="active";
      b.onclick=()=>{ activeType=t; document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); loadGraph(t); };
      bar.appendChild(b);
    });
  }

  buildFilters();
  loadGraph("all");

  // When the detail rail opens/closes the #cy canvas resizes (margin-right
  // transition). Tell Cytoscape to re-fit so nodes stay centered, not clipped.
  const railObserver = new MutationObserver(() => {
    if (!cy) return;
    setTimeout(() => { cy.resize(); cy.fit(undefined, 40); }, 240);
  });
  railObserver.observe(document.body, { attributes: true, attributeFilter: ["class"] });
  </script>
</body>
</html>
